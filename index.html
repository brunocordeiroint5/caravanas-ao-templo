<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Caravana ao Templo - Reserva de Poltronas</title>

<style>
body{
font-family:Arial;
background:#f2f2f2;
text-align:center;
}

h1{
margin-top:20px;
}

.info{
margin-bottom:20px;
}

.bus{
display:grid;
grid-template-columns:repeat(5,70px);
gap:10px;
justify-content:center;
}

.seat{
background:#28a745;
color:white;
padding:15px;
border-radius:8px;
cursor:pointer;
font-size:13px;
}

.seat:hover{
transform:scale(1.05);
}

.occupied{
background:#dc3545;
cursor:not-allowed;
}

.corridor{
background:transparent;
}

.legend{
margin-top:25px;
}

.box{
width:20px;
height:20px;
display:inline-block;
margin-right:5px;
}

.free{background:#28a745;}
.taken{background:#dc3545;}

</style>
</head>

<body>

<h1>🚌 Caravana ao Templo</h1>

<div class="info">
<p><b>Data:</b> 21/04</p>
<p><b>Saída:</b> Cruz Alta</p>
<p>Escolha sua poltrona</p>
</div>

<div class="bus" id="bus"></div>

<div class="legend">
<p><span class="box free"></span> Livre</p>
<p><span class="box taken"></span> Reservado</p>
</div>

<script>

const bus = document.getElementById("bus");

let reservas = JSON.parse(localStorage.getItem("caravanaTemplo")) || {};

function criarAssento(numero){

let seat=document.createElement("div");
seat.className="seat";
seat.innerText=numero;

if(reservas[numero]){
seat.classList.add("occupied");
seat.innerText=numero+"\n"+reservas[numero].nome;
}

seat.onclick=function(){

if(reservas[numero]){
alert("Poltrona já reservada");
return;
}

let nome=prompt("Digite seu nome");
if(!nome)return;

let telefone=prompt("Telefone");

reservas[numero]={nome,telefone};

localStorage.setItem("caravanaTemplo",JSON.stringify(reservas));

seat.classList.add("occupied");
seat.innerText=numero+"\n"+nome;

}

bus.appendChild(seat);

}

let num=1;

for(let i=0;i<13;i++){

criarAssento(num++);
criarAssento(num++);

let corredor=document.createElement("div");
corredor.className="corridor";
bus.appendChild(corredor);

if(num<=50)criarAssento(num++);
if(num<=50)criarAssento(num++);

}

</script>

</body>
</html>
